<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:Arial,sans-serif;font-size:18px;line-height:1.7;color:#1e293b;background:#f8fafc;padding:24px">
  <main style="max-width:540px;margin:auto;background:white;padding:28px;border-radius:16px">
    <h1 style="font-size:26px">비밀번호를 다시 설정해 주세요</h1>
    <p>U-LIFE 계정의 새 비밀번호를 만들 수 있습니다.</p>
    <p><a href="{{ .SiteURL }}/auth/reset-password#token_hash={{ .TokenHash }}" style="display:inline-block;padding:16px 24px;background:#115e59;color:white;border-radius:8px;text-decoration:none">새 비밀번호 만들기</a></p>
    <p>요청 후 15분 안에 사용해 주세요. 링크는 한 번만 사용할 수 있습니다. 다른 기기에서도 열 수 있습니다.</p>
    <p>직접 요청하지 않으셨다면 이 메일을 무시해 주세요. 링크를 열기만 해서는 비밀번호가 바뀌지 않습니다.</p>
    <p>비밀번호를 바꾸면 이전 로그인은 종료됩니다. 비밀번호나 이 메일의 링크를 다른 사람에게 알려주지 마세요.</p>
  </main>
</body>
</html>
