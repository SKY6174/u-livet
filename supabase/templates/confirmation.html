<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U-LiVET 회원가입 이메일 확인</title>
</head>
<body style="margin:0;padding:24px;background:#f8fafc;color:#1e293b;font-family:Arial,'Malgun Gothic',sans-serif;font-size:16px;line-height:1.7">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px">
    <tr><td style="padding:32px 28px">
      <p style="margin:0 0 20px;color:#115e59;font-size:15px;font-weight:700">U-LiVET</p>
      <h1 style="margin:0 0 16px;font-size:25px;line-height:1.4">회원가입 이메일 확인</h1>
      <p style="margin:0 0 12px">안녕하세요. U-LiVET 회원가입을 신청해 주셔서 감사합니다.</p>
      <p style="margin:0 0 24px">아래 버튼을 눌러 확인 화면을 연 뒤, 가입에 사용한 이메일 주소를 확인해 주세요.</p>
      <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm-email#token_hash={{ .TokenHash }}" style="display:inline-block;padding:13px 22px;background:#115e59;border-radius:8px;color:#ffffff;font-weight:700;text-decoration:none">이메일 확인 화면 열기</a></p>
      <p style="margin:0 0 20px">직접 회원가입을 신청하지 않았다면 이 메일을 무시해 주세요. 확인 링크와 비밀번호는 다른 사람에게 알려주지 마세요.</p>
      <p style="margin:0;padding-top:20px;border-top:1px solid #e2e8f0;color:#64748b;font-size:14px">U-LiVET</p>
    </td></tr>
  </table>
</body>
</html>
