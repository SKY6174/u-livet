name: Pull request quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: scope
        run: node .github/scripts/build-scope.mjs github
      - name: Verify conservative build selection
        run: node --test .github/scripts/build-scope.test.mjs
      - run: npm ci --include=dev --include=optional --prefer-offline --no-audit
        if: steps.scope.outputs.app == 'true'
      - run: npm audit --omit=dev --audit-level=high
        if: steps.scope.outputs.app == 'true'
      - run: npm run lint
        if: steps.scope.outputs.app == 'true'
      - run: npm run test:release
        if: steps.scope.outputs.app == 'true'
      - run: npm run test:supabase-cli
        if: steps.scope.outputs.app == 'true'
      - run: npm run test:production-origins
        if: steps.scope.outputs.app == 'true'
      - run: npm exec -- supabase start
        if: steps.scope.outputs.app == 'true'
      - run: npm run test:core
        if: steps.scope.outputs.app == 'true'
